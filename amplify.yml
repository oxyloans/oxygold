version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customRules:
    - source: /physical-gold/account-deletion
      target: /physical-gold/account-deletion/index.html
      status: '200'
    - source: /physical-gold/account-deletion/
      target: /physical-gold/account-deletion/index.html
      status: '200'
    - source: /physical-gold/account-delet
      target: /physical-gold/account-deletion/index.html
      status: '200'
    - source: /physical-gold/account-delet/
      target: /physical-gold/account-deletion/index.html
      status: '200'
    - source: /physical-gold/<*>
      target: /index.html
      status: '200'
